name: Fazendinha Build (unsigned IPA)

# Build sob demanda do jogo "A Fazenda da Manu" (SwiftUI + SceneKit puro,
# sem FFmpeg/CoreML). O target Fazendinha vive no mesmo PocketAI.xcodeproj
# (gerado pelo project.yml da raiz). Gera um .ipa não assinado; o AltStore
# assina na instalação no tablet — mesmo fluxo do workflow "iOS Build".
on:
  workflow_dispatch:
  # Enquanto o build não estabiliza, roda a cada push que toque no jogo —
  # o alvo é leve (sem FFmpeg/CoreML), o build inteiro leva menos de 1 min.
  push:
    paths:
      - 'Fazendinha/**'
      - 'project.yml'
      - '.github/workflows/fazendinha-build.yml'

permissions:
  contents: write   # necessário para publicar o Release com o .ipa

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Os erros são reemitidos como ::error:: para virarem annotations, visíveis
      # na API pública do run — dá pra diagnosticar sem baixar o log completo.
      - name: Build (sem assinatura)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project PocketAI.xcodeproj \
            -scheme Fazendinha \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          then
            grep -E '(error|warning): ' build.log | sort -u | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Fazendinha.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Fazendinha-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fazendinha-unsigned-ipa
          path: Fazendinha-unsigned.ipa

      # Baixar artefato do Actions exige login; um Release em repo público dá uma
      # URL direta — serve para instalar pelo Safari do próprio iPad, sem PC.
      # A tag é fixa e o release é sobrescrito a cada build.
      - name: Publicar Release com o IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fazendinha-latest
          name: A Fazenda da Manu — build mais recente
          body: |
            IPA **não assinado** do jogo, gerado automaticamente pelo commit ${{ github.sha }}.

            Instalação: baixe o `.ipa` e abra no AltStore (My Apps → **+**).
            O AltStore assina com seu Apple ID na hora da instalação.
          files: Fazendinha-unsigned.ipa
          fail_on_unmatched_files: true
